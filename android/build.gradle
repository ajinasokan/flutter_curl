group 'com.ajinasokan.flutter_curl'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

// Prebuilt libcurl aar, published as a release asset on
// github.com/ajinasokan/flutter_curl_binary.
def curlBinaryVersion = '0.9.1'

// GitHub's release URLs fit an Ivy pattern, so Gradle can fetch the aar as an
// ordinary dependency: it handles redirects, proxies and retries, and caches the
// download in ~/.gradle/caches so a clean build does not hit the network again.
rootProject.allprojects {
    repositories {
        ivy {
            url = 'https://github.com'
            patternLayout {
                artifact '[organisation]/[module]/releases/download/[revision]/[artifact].[ext]'
            }
            // Release assets ship on their own, with no pom or ivy.xml beside them.
            metadataSources { artifact() }
            // Without this every dependency in the app would be looked up on github.com.
            content { includeModule('ajinasokan', 'flutter_curl_binary') }
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.ajinasokan.flutter_curl"

    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 16
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation(group: 'ajinasokan', name: 'flutter_curl_binary', version: curlBinaryVersion) {
        // The asset is named Curl.aar, which the module name alone would not give us.
        artifact {
            name = 'Curl'
            type = 'aar'
            extension = 'aar'
        }
    }
}
