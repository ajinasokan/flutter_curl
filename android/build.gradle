group 'com.ajinasokan.flutter_curl'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.0'
    }
}

rootProject.allprojects {
    repositories {
        maven {
            url "${rootProject.buildDir}/flutter_curl/curlmaven"
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace "com.ajinasokan.flutter_curl"

    compileSdk flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdkVersion 16
    }
    lint {
        disable 'InvalidPackage'
    }
}

// Download url into dest, retrying up to 3 times on failure.
def downloadWithRetry = { String url, File dest ->
    for (int i = 1; i <= 3; i++) {
        try {
            println "[flutter_curl] downloading ${url} (attempt ${i}/3)"
            def conn = new URL(url).openConnection() as HttpURLConnection
            conn.connectTimeout = 30 * 1000
            conn.readTimeout = 60 * 1000
            conn.instanceFollowRedirects = true
            conn.inputStream.withStream { is ->
                dest.withOutputStream { os -> os << is }
            }
            println "[flutter_curl] downloaded ${dest.name} (${dest.length()} bytes)"
            return
        } catch (Exception e) {
            println "[flutter_curl] download attempt ${i}/3 failed: ${e}"
        }
    }
}

def urlImplementation = { url, name ->
    File file = new File("$buildDir/$name")
    file.parentFile.mkdirs()
    if (!file.exists()) {
        copy {
            from "$projectDir/maven"
            into "$buildDir/curlmaven"
        }
        downloadWithRetry(url, file)
    } else {
        println "[flutter_curl] using cached ${file}"
    }
    'com.ajinasokan:flutter_curl:0.0.1'
}

dependencies {
    implementation urlImplementation(
        "https://github.com/ajinasokan/flutter_curl_binary/releases/download/0.9.1/Curl.aar", "curlmaven/com/ajinasokan/flutter_curl/0.0.1/flutter_curl-0.0.1.aar"
    )
}
